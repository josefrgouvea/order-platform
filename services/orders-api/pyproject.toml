[project]
name = "orders-api"
version = "0.1.0"
description = "API da plataforma de pedidos orientada a eventos"
readme = "README.md"
authors = [
    { name = "Jose Francisco Gouvea" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
